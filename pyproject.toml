[project]
name = "rethinking-python"
version = "0.1.0"
description = "Python implementations of the examples from Statistical Rethinking by Richard McElreath"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Thomas Pijper" },
]
requires-python = ">=3.12"
keywords = ["bayesian statistics", "pymc", "statistical rethinking", "arviz"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "arviz==1.3.0",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pymc==6.3.1",
    "pymc-extras==0.14.0",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "statsmodels==0.14.6",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
